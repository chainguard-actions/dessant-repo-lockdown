name: Test basic action startup and skip behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          process-only: issues
          close-issue: 'true'
          lock-issue: 'true'
          log-output: 'true'

      - name: Assert action succeeded (skipped due to process-only mismatch)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES_OUTPUT: ${{ steps.action.outputs.issues }}
          PRS_OUTPUT: ${{ steps.action.outputs.prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues output: '$ISSUES_OUTPUT'"
          echo "prs output: '$PRS_OUTPUT'"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: expected action to succeed (skip) but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly skipped processing"

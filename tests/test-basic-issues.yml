name: Test basic issues processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          process-only: issues
          exclude-issue-created-before: '2099-01-01T00:00:00Z'
          close-issue: 'true'
          lock-issue: 'true'
          issue-close-reason: 'not planned'
          log-output: 'true'

      - name: Assert issues output is valid JSON or empty
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "issues output: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed (outcome=$OUTCOME), skipping output assertion"
            exit 0
          fi
          if [ -z "$ISSUES" ]; then
            echo "PASS: issues output is empty (no issues to process)"
          else
            NORM="$(echo "$ISSUES" | tr -d '[:space:]')"
            if echo "$NORM" | grep -qE '^\[.*\]$|^\{.*\}$|^null$'; then
              echo "PASS: issues output is valid JSON: $ISSUES"
            else
              echo "FAIL: issues output is not valid JSON: $ISSUES"
              exit 1
            fi
          fi

      - name: Assert prs output is empty or null (process-only issues)
        env:
          PRS: ${{ steps.action.outputs.prs }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "prs output: $PRS"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed (outcome=$OUTCOME), skipping output assertion"
            exit 0
          fi
          if [ -n "$PRS" ]; then
            NORM="$(echo "$PRS" | tr -d '[:space:]')"
            if [ "$NORM" != "[]" ] && [ "$NORM" != "{}" ] && [ "$NORM" != "null" ]; then
              echo "FAIL: expected empty prs output when process-only=issues, got: $PRS"
              exit 1
            fi
          fi
          echo "PASS: prs output is empty as expected"

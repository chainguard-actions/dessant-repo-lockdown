name: Test schedule event path
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: schedule
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          close-issue: 'true'
          lock-issue: 'true'
          close-pr: 'true'
          lock-pr: 'true'
          log-output: 'false'
        continue-on-error: true

      - name: Assert action ran (schedule or fallback path)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES_OUTPUT: ${{ steps.action.outputs.issues }}
          PRS_OUTPUT: ${{ steps.action.outputs.prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues output: '$ISSUES_OUTPUT'"
          echo "prs output: '$PRS_OUTPUT'"
          # The action makes API calls (schedule path or processNewThread)
          # With a fake token it will fail with an API error - that is expected
          # We just verify the action ran (not a startup/config crash)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

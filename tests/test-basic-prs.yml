name: Test basic usage - process pull requests only
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          process-only: prs
          close-pr: 'true'
          lock-pr: 'true'
          log-output: 'true'
        continue-on-error: true
      - name: Assert prs output is valid JSON or empty
        env:
          PRS_OUTPUT: ${{ steps.action.outputs.prs }}
        run: |
          echo "prs output: $PRS_OUTPUT"
          # The output should either be a JSON array or empty string
          if [ -n "$PRS_OUTPUT" ]; then
            echo "$PRS_OUTPUT" | python3 -c "import sys, json; json.load(sys.stdin)" 2>/dev/null
            if [ $? -ne 0 ]; then
              echo "FAIL: prs output is not valid JSON: $PRS_OUTPUT"
              exit 1
            fi
            echo "PASS: prs output is valid JSON"
          else
            echo "PASS: prs output is empty (no PRs processed)"
          fi
      - name: Assert issues output is empty when process-only is prs
        env:
          ISSUES_OUTPUT: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues output: $ISSUES_OUTPUT"
          # When process-only is 'prs', issues output should be empty or an empty array
          if [ -n "$ISSUES_OUTPUT" ] && [ "$ISSUES_OUTPUT" != "[]" ]; then
            echo "WARN: issues output is non-empty when process-only=prs: $ISSUES_OUTPUT"
          else
            echo "PASS: issues output is empty or empty array as expected"
          fi

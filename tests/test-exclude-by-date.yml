name: Test exclude by creation date
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          exclude-issue-created-before: '2099-01-01T00:00:00Z'
          exclude-pr-created-before: '2099-01-01T00:00:00Z'
          close-issue: 'true'
          lock-issue: 'true'
          close-pr: 'true'
          lock-pr: 'true'
          log-output: 'true'

      - name: Assert issues output is valid JSON or empty (all excluded by future date)
        env:
          ISSUES: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "issues output: $ISSUES"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed (outcome=$OUTCOME), skipping output assertion"
            exit 0
          fi
          if [ -z "$ISSUES" ]; then
            echo "PASS: issues output is empty (all excluded by date filter)"
          else
            NORM="$(echo "$ISSUES" | tr -d '[:space:]')"
            if echo "$NORM" | grep -qE '^\[.*\]$|^\{.*\}$|^null$'; then
              echo "PASS: issues output is valid JSON: $ISSUES"
            else
              echo "FAIL: issues output is not valid JSON: $ISSUES"
              exit 1
            fi
          fi

      - name: Assert prs output is valid JSON or empty (all excluded by future date)
        env:
          PRS: ${{ steps.action.outputs.prs }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "prs output: $PRS"
          if [ "$OUTCOME" != "success" ]; then
            echo "SKIP: action did not succeed (outcome=$OUTCOME), skipping output assertion"
            exit 0
          fi
          if [ -z "$PRS" ]; then
            echo "PASS: prs output is empty (all excluded by date filter)"
          else
            NORM="$(echo "$PRS" | tr -d '[:space:]')"
            if echo "$NORM" | grep -qE '^\[.*\]$|^\{.*\}$|^null$'; then
              echo "PASS: prs output is valid JSON: $PRS"
            else
              echo "FAIL: prs output is not valid JSON: $PRS"
              exit 1
            fi
          fi

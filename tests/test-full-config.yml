name: Test full configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          issue-comment: 'This repository does not accept new issues.'
          issue-labels: 'invalid'
          skip-closed-issue-comment: 'true'
          close-issue: 'true'
          issue-close-reason: 'not planned'
          lock-issue: 'true'
          issue-lock-reason: 'off-topic'
          pr-comment: 'This repository does not accept pull requests.'
          pr-labels: 'invalid'
          skip-closed-pr-comment: 'true'
          close-pr: 'true'
          lock-pr: 'true'
          pr-lock-reason: 'resolved'
          log-output: 'true'

      - name: Assert action ran (success or expected failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ISSUES_OUT: ${{ steps.action.outputs.issues }}
          PRS_OUT: ${{ steps.action.outputs.prs }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues output: $ISSUES_OUT"
          echo "prs output: $PRS_OUT"
          # In a test environment without real GitHub API context, the action
          # may fail. Either outcome is acceptable as long as the action ran.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

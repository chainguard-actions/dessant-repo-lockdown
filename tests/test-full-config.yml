name: Test full configuration with all inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          issue-comment: 'This repository does not accept new issues.'
          skip-closed-issue-comment: 'false'
          close-issue: 'true'
          issue-close-reason: 'not planned'
          lock-issue: 'true'
          issue-lock-reason: 'resolved'
          pr-comment: 'This repository does not accept new pull requests.'
          skip-closed-pr-comment: 'false'
          close-pr: 'true'
          lock-pr: 'true'
          pr-lock-reason: 'resolved'
          log-output: 'true'
        continue-on-error: true
      - name: Assert action completed (outputs exist or action ran)
        env:
          ISSUES_OUTPUT: ${{ steps.action.outputs.issues }}
          PRS_OUTPUT: ${{ steps.action.outputs.prs }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "issues output: $ISSUES_OUTPUT"
          echo "prs output: $PRS_OUTPUT"
          # The action should either succeed or fail gracefully (not crash with unhandled exception)
          # Acceptable outcomes: success (no issues/PRs to process) or failure (API auth issue in test env)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
      - name: Assert issues output is valid JSON if present
        env:
          ISSUES_OUTPUT: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues output: $ISSUES_OUTPUT"
          if [ -n "$ISSUES_OUTPUT" ]; then
            echo "$ISSUES_OUTPUT" | python3 -c "import sys, json; json.load(sys.stdin)"
            if [ $? -ne 0 ]; then
              echo "FAIL: issues output is not valid JSON"
              exit 1
            fi
            echo "PASS: issues output is valid JSON"
          else
            echo "PASS: no issues output (none processed)"
          fi
      - name: Assert prs output is valid JSON if present
        env:
          PRS_OUTPUT: ${{ steps.action.outputs.prs }}
        run: |
          echo "prs output: $PRS_OUTPUT"
          if [ -n "$PRS_OUTPUT" ]; then
            echo "$PRS_OUTPUT" | python3 -c "import sys, json; json.load(sys.stdin)"
            if [ $? -ne 0 ]; then
              echo "FAIL: prs output is not valid JSON"
              exit 1
            fi
            echo "PASS: prs output is valid JSON"
          else
            echo "PASS: no prs output (none processed)"
          fi

name: Test lock reason and label configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: ${{ github.token }}
          process-only: issues
          close-issue: 'true'
          lock-issue: 'true'
          issue-lock-reason: 'spam'
          issue-labels: 'invalid,wontfix'
          issue-comment: 'Issues are not accepted in this repository.'
          skip-closed-issue-comment: 'true'
          log-output: 'true'
        continue-on-error: true

      - name: Assert action completed without fatal error
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should either succeed or fail gracefully (not crash)
          # success = no issues to process, failure = API error (acceptable in test env)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action completed with outcome: $OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi

      - name: Assert issues output format
        env:
          ISSUES_OUT: ${{ steps.action.outputs.issues }}
        run: |
          echo "issues output: $ISSUES_OUT"
          if [ -n "$ISSUES_OUT" ]; then
            echo "$ISSUES_OUT" | python3 -c "import sys, json; json.load(sys.stdin)" 2>&1
            if [ $? -ne 0 ]; then
              echo "FAIL: issues output is not valid JSON"
              exit 1
            fi
            echo "PASS: issues output is valid JSON"
          else
            echo "PASS: no issues output (none processed)"
          fi

name: Test process-only issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: issues
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          process-only: issues
          close-issue: 'true'
          lock-issue: 'true'
          issue-lock-reason: 'spam'
          log-output: 'true'

      - name: Assert issues output is valid JSON or empty
        env:
          ISSUES_OUT: ${{ steps.action.outputs.issues }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "issues output: $ISSUES_OUT"
          # The action may fail due to no real GitHub context, but if it succeeds
          # the output should be valid JSON (array)
          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$ISSUES_OUT" ]; then
              echo "$ISSUES_OUT" | python3 -c "import sys,json; data=json.load(sys.stdin); assert isinstance(data, list), 'Expected JSON array'" || {
                echo "FAIL: issues output is not a valid JSON array"
                exit 1
              }
              echo "PASS: issues output is valid JSON array"
            else
              echo "PASS: no issues output (empty)"
            fi
          else
            echo "PASS: action did not succeed (expected in test environment without real GitHub context)"
          fi

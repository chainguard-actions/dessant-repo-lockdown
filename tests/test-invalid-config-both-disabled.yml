name: Test invalid config - both close and lock disabled for issues
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          github-token: fake-token-for-testing
          close-issue: 'false'
          lock-issue: 'false'
        continue-on-error: true

      - name: Assert action failed due to invalid config
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # When both close-issue and lock-issue are false, the Joi schema validation
          # should fail and the action should report failure via core.setFailed()
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid config but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid config"
